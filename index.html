;font-weight:800;text-align:center;padding-right:20px}.modal-body{display:flex;gap:18px;min-height:0;flex:1}.cat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;width:150px;flex:0 0 auto;overflow-y:auto;max-height:48vh}.cat-list li button{width:100%;text-align:left;padding:9px 11px;border-radius:12px;font-size:.8rem;color:var(--muted);border:1px solid transparent}.cat-list li button.active{background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--ink);border-color:color-mix(in srgb,var(--a) 50%,transparent)}.cat-content{flex:1;display:flex;flex-direction:column;min-width:0}.cat-stage{position:relative;flex:1;overflow-y:auto;padding-right:4px}.cat-pane{position:absolute;inset:0;opacity:0;transform:translateX(18px);transition:opacity .5s ease,transform .5s ease;pointer-events:none}.cat-pane.active{position:relative;opacity:1;transform:translateX(0);pointer-events:auto}.cat-pane.leaving{position:absolute;opacity:0;transform:translateX(-18px)}.cat-pane h3{font-size:1.05rem;font-weight:800;color:var(--pink-soft);margin-bottom:8px}.cat-pane p{color:var(--ink);font-size:.9rem;line-height:1.65}.cat-pane ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}.cat-pane ul li{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.8rem}.cat-nav{display:flex;align-items:center;gap:10px;margin-top:12px}.cat-nav button{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--line)}.cat-progress{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}.cat-progress span{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .1s linear}@media (max-width:640px){.modal-body{flex-direction:column}.cat-list{flex-direction:row;width:100%;max-height:none;overflow-x:auto;padding-bottom:4px}.cat-list li{flex:0 0 auto}.player{flex-direction:column;text-align:center}.progress{width:100%}.equalizer-wrap{width:100%;height:72px}}@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}</style>

<body>

<div id="cursorGhost">
  <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff6fd"/>
        <stop offset="45%" stop-color="#ff8ad6"/>
        <stop offset="100%" stop-color="#9b4dff"/>
      </linearGradient>
    </defs>
    <path d="M20 3l3.6 9.4L33 16l-9.4 3.6L20 29l-3.6-9.4L7 16l9.4-3.6z" fill="url(#starGrad)" stroke="#3a0d2b" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="31" cy="8" r="1.6" fill="#fff6fd"/>
    <circle cx="8" cy="30" r="1.2" fill="#fff6fd"/>
  </svg>
</div>

<section id="splash">
  <div class="synthwave-bg">
    <canvas id="skyCanvas" class="sky-field" data-density="5200"></canvas>
    <div class="sw-sun"></div>
    <div class="sw-grid"></div>
  </div>
  <div id="notesLayer"></div>
  <button id="toggleNotes">⏸ Detener Notas</button>
  <div class="splash-grid">
    <div class="splash-copy">
      <p class="entry-legend script" id="welcomeLegend"></p>
      <p class="kicker mag-eyebrow" id="entryKicker"></p>
      <h1 class="entry-title mag" id="entryTitle"></h1>
      <p class="entry-text" id="entryText"></p>
      <button id="enterBtn"></button>
      <p class="entry-note" id="entryNote"></p>
    </div>
    <div class="entry-visual">
      <video id="entryVideo" autoplay muted loop playsinline aria-label="Video de bienvenida de Maya"></video>
    </div>
  </div>
</section>

<div id="app" hidden>
  <div class="synthwave-bg fixed">
    <canvas id="appSky" class="sky-field" data-density="9500" data-dim="0.7"></canvas>
    <div class="sw-sun"></div>
    <div class="sw-grid"></div>
  </div>
  <header class="topbar">
    <span class="brand">MAYA</span>
    <span class="section-title" id="sectionTitle">Bienvenid@s a mi XatSpace</span>
    <div class="topbar-actions">
      <div class="theme-switch" id="themeSwitch"></div>
      <button id="backToEntry" class="icon-btn" aria-label="Volver a la entrada" title="Volver a la entrada">⤺</button>
    </div>
  </header>

  <main class="shell">
    <section class="zone" data-title="Bienvenid@s a mi XatSpace">
      <div class="profile-cards-row">
        <div id="profile" class="profile-col">
          <div class="profile-card neon-outline">
            <img id="profileImage" alt="Imagen de perfil de Maya">
          </div>
          <span class="pass-tag">ALL ACCESS</span>
          <h1 id="profileTitle"></h1>
          <p id="profileSubtitle"></p>
          <p id="profileBio"></p>
        </div>

        <div id="cards" class="cards-col">
          <div class="section-head">
            <h2 id="cardsTitle"></h2>
            <p id="cardsIntro"></p>
          </div>
          <div class="carousel neon-outline">
            <button class="nav prev" id="cardPrev" aria-label="Escena anterior">‹</button>
            <div class="carousel-stage" id="cardStage"></div>
            <button class="nav next" id="cardNext" aria-label="Escena siguiente">›</button>
          </div>
          <div class="dots" id="cardDots"></div>
        </div>
      </div>

    </section>

    <hr class="zone-divider">

    <section class="zone" data-title="Sobre Mí Y Mi Música">
      <div class="mid-row">
        <div class="about-counter-col neon-outline">
          <button id="aboutBtn"><span id="aboutBtnLabel"></span></button>
          <p id="aboutIntro"></p>
          <div class="counter-box">
            <span class="counter-label" id="counterLabel"></span>
            <strong id="counterValue">—</strong>
          </div>
        </div>

        <div class="player-col">
          <div class="section-head">
            <h2 id="playerTitle"></h2>
            <p id="playerSubtitle"></p>
          </div>
          <div class="player neon-outline">
            <div class="cassette-wrap">
              <div class="cassette-body">
                <div class="cassette-window">
                  <span class="tape-label" id="tapeLabel">SIDE A</span>
                  <div class="reels">
                    <div class="reel" id="reelL"><span></span></div>
                    <div class="tape-line"></div>
                    <div class="reel" id="reelR"><span></span></div>
                  </div>
                </div>
                <div class="cassette-footer">
                  <img id="trackCover" alt="Portada del tema" class="cassette-sticker">
                  <span class="play-led" id="playLed"></span>
                </div>
              </div>
            </div>
            <div class="track-info">
              <p id="trackTitle"></p>
              <p id="trackArtist"></p>
              <p id="trackAlbum"></p>
              <div class="progress">
                <span id="curTime">0:00</span>
                <input type="range" id="seek" min="0" max="100" value="0">
                <span id="durTime">0:00</span>
              </div>
              <div class="controls">
                <button id="prevTrack" aria-label="Tema anterior">⏮</button>
                <button id="playPause" aria-label="Reproducir">▶</button>
                <button id="nextTrack" aria-label="Tema siguiente">⏭</button>
                <input type="range" id="volume" min="0" max="1" step="0.01">
              </div>
            </div>
            <div class="equalizer-wrap"><canvas id="equalizer"></canvas></div>
          </div>
          <audio id="audio" preload="metadata" loop="false"></audio>
        </div>
      </div>
    </section>

    <hr class="zone-divider">

    <section class="zone" data-title="Enlaces Y Mensajes">
      <div class="bottom-row">
        <div class="rooms-col"><div class="rooms-box neon-outline"><p class="rooms-label" id="roomsLabel"></p><div id="roomLinks"></div></div></div>
        <div class="messages-col">
          <div class="message-box neon-outline"><p id="messageText"></p></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p id="footerText"></p>
  </footer>

  <div class="version-badge" id="versionBadge"></div>
</div>

<div id="aboutModal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-panel neon-outline" role="dialog" aria-modal="true">
    <button id="closeAbout" aria-label="Cerrar">✕</button>
    <h2 id="aboutModalTitle"></h2>
    <div class="modal-body">
      <ul class="cat-list" id="catList"></ul>
      <div class="cat-content">
        <div class="cat-stage" id="catStage"></div>
        <div class="cat-nav">
          <button id="catPrev" aria-label="Categoría anterior">‹</button>
          <div class="cat-progress" id="catProgress"><span></span></div>
          <button id="catNext" aria-label="Categoría siguiente">›</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>const CFG = JSON.parse(
new TextDecoder().decode(
Uint8Array.from(atob(document.getElementById('cfg').textContent), c => c.charCodeAt(0))
)
);
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('keydown', e => {
const k = e.key ? e.key.toUpperCase() : '';
const blocked =
k === 'F12' ||
(e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(k)) ||
(e.ctrlKey && (k === 'U' || k === 'S')) ||
(e.metaKey && e.altKey && ['I', 'J', 'C'].includes(k));
if (blocked) e.preventDefault();
});
const $ = id => document.getElementById(id);
const setText = (id, val) => { const el = $(id); if (el && val != null) el.textContent = val; };
const setSrc = (id, val) => { const el = $(id); if (el && val) el.src = val; };
setText('entryKicker', CFG.entryKicker);
setText('entryTitle', CFG.entryTitle);
setText('entryText', CFG.entryText);
setText('entryNote', CFG.entryNote);
setText('enterBtn', CFG.entryButton);

setSrc('entryVideo', CFG.entryVideo);

setText('profileBio', CFG.profileBio);
setText('aboutBtnLabel', CFG.aboutButtonLabel);

setText('versionBadge', CFG.siteVersion);
const roomWrap = $('roomLinks');
(CFG.rooms || []).forEach(r => {
const a = document.createElement('a');
a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
a.textContent = r.label;
roomWrap.appendChild(a);
});
function mountSky(canvas, { density = 6500, dim = 1 } = {}) {
const ctx = canvas.getContext('2d');
let w, h, stars = [];
function resize() {
w = canvas.width = canvas.offsetWidth;
h = canvas.height = canvas.offsetHeight;
stars = Array.from({ length: Math.max(16, Math.round((w * h) / density)) }, () => ({
x: Math.random() * w,
y: Math.random() * h,
r: Math.random() * 1.3 + .3,
p: Math.random() * Math.PI * 2,
s: Math.random() * .015 + .006
}));
}
function tick() {
if (w && h) {
ctx.clearRect(0, 0, w, h);
stars.forEach(st => {
st.p += st.s;
const alpha = (.35 + Math.sin(st.p) * .35 + .3) * dim;
ctx.beginPath();
ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
ctx.fillStyle = `rgba(255,255,255,${Math.max(.1, alpha)})`;
ctx.fill();
});
}
requestAnimationFrame(tick);
}
window.addEventListener('resize', resize);
resize();
tick();
}
document.querySelectorAll('canvas.sky-field').forEach(c => {
mountSky(c, {
density: Number(c.dataset.density) || 6500,
dim: c.dataset.dim ? Number(c.dataset.dim) : 1
});
});
(function notes() {
const layer = $('notesLayer');
const glyphs = ['♪', '♫', '♬', '✦'];
const total = 16;
for (let i = 0; i < total; i++) {
const n = document.createElement('span');
n.className = 'note';
n.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
n.style.left = Math.random() * 100 + '%';
n.style.fontSize = 14 + Math.random() * 16 + 'px';
n.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
n.style.animationDuration = 9 + Math.random() * 9 + 's';
n.style.animationDelay = (Math.random() * 12) + 's';
layer.appendChild(n);
}
for (let i = 0; i < 22; i++) {
const s = document.createElement('span');
s.className = 'spark-bit';
s.style.left = Math.random() * 100 + '%';
s.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
s.style.animationDuration = 7 + Math.random() * 7 + 's';
s.style.animationDelay = (Math.random() * 10) + 's';
layer.appendChild(s);
}
const btn = $('toggleNotes');
let paused = false;
btn.addEventListener('click', () => {
paused = !paused;
layer.classList.toggle('paused', paused);
btn.textContent = paused ? ('▶ ' + CFG.notesResume) : ('⏸ ' + CFG.notesPause);
});
})();
(function cursor() {
const ghost = $('cursorGhost');
let mx = -100, my = -100, gx = -100, gy = -100;
let last = 0;
window.addEventListener('mousemove', e => {
mx = e.clientX; my = e.clientY;
const now = performance.now();
if (now - last > 55) {
last = now;
const spark = document.createElement('span');
spark.className = 'cursor-spark';
spark.style.left = mx + 'px';
spark.style.top = my + 'px';
document.body.appendChild(spark);
setTimeout(() => spark.remove(), 720);
}
}, { passive: true });
function loop() {
gx += (mx - gx) * .22;
gy += (my - gy) * .22;
ghost.style.transform = `translate(${gx}px,${gy}px) translate(-50%,-50%)`;
requestAnimationFrame(loop);
}
loop();
})();
let pausePlayer = () => {};
$('enterBtn').addEventListener('click', () => {
$('splash').classList.add('leaving');
setTimeout(() => {
$('splash').style.display = 'none';
$('app').hidden = false;
window.dispatchEvent(new Event('resize'));
startPlayer(true);
}, 480);
});
$('backToEntry').addEventListener('click', () => {
pausePlayer();
$('app').hidden = true;
$('splash').style.display = '';
$('splash').classList.remove('leaving');
});
(function themes() {
const wrap = $('themeSwitch');
(CFG.themes || []).forEach((t, i) => {
const b = document.createElement('button');
b.className = 'theme-dot' + (i === 0 ? ' active' : '');
b.dataset.key = t.key;
b.title = t.label;
b.addEventListener('click', () => {
document.documentElement.dataset.theme = t.key;
wrap.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
b.classList.add('active');
});
wrap.appendChild(b);
});
})();
(function sectionTitle() {
const label = $('sectionTitle');
const sections = document.querySelectorAll('.zone[data-title]');
const io = new IntersectionObserver(entries => {
entries.forEach(en => {
if (en.isIntersecting) label.textContent = en.target.dataset.title;
});
}, { rootMargin: '-40% 0px -50% 0px' });
sections.forEach(s => io.observe(s));
})();
(function cards() {
const stage = $('cardStage');
const dots = $('cardDots');
const items = CFG.cards || [];
const useDots = items.length > 0 && items.length <= 10;
let counter = null;
let idx = 0, timer = null;
items.forEach((c, i) => {
const img = document.createElement('img');
img.src = c.src; img.alt = c.alt; img.loading = 'lazy';
if (i === 0) img.classList.add('active');
stage.appendChild(img);
if (useDots) {
const d = document.createElement('button');
d.setAttribute('aria-label', 'Ir a la escena ' + (i + 1));
if (i === 0) d.classList.add('active');
d.addEventListener('click', () => go(i));
dots.appendChild(d);
}
});
if (!useDots && items.length) {
counter = document.createElement('p');
counter.className = 'card-counter';
dots.after(counter);
}
function render() {
[...stage.children].forEach((im, i) => im.classList.toggle('active', i === idx));
if (useDots) [...dots.children].forEach((d, i) => d.classList.toggle('active', i === idx));
if (counter) counter.textContent = (idx + 1) + ' / ' + items.length;
}
function go(i) {
idx = (i + items.length) % items.length;
render();
restart();
}
function restart() {
clearInterval(timer);
if (items.length > 1) timer = setInterval(() => go(idx + 1), CFG.cardsIntervalMs || 6500);
}
$('cardPrev').addEventListener('click', () => go(idx - 1));
$('cardNext').addEventListener('click', () => go(idx + 1));
render();
restart();
})();
(function tiltCarousel() {
const el = document.querySelector('.carousel');
if (!el || typeof window.matchMedia !== 'function' || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
el.style.transformStyle = 'preserve-3d';
el.addEventListener('mousemove', e => {
const r = el.getBoundingClientRect();
const px = (e.clientX - r.left) / r.width - 0.5;
const py = (e.clientY - r.top) / r.height - 0.5;
el.style.transform = `perspective(700px) rotateX(${(-py * 8).toFixed(2)}deg) rotateY(${(px * 10).toFixed(2)}deg)`;
});
el.addEventListener('mouseleave', () => { el.style.transform = ''; });
})();
(function syncProfileHeight() {
const profile = document.querySelector('.profile-card');
const carousel = document.querySelector('.carousel');
if (!profile || !carousel) return;
function sync() {
const h = carousel.getBoundingClientRect().height;
if (h > 0) profile.style.height = Math.round(h * 0.85) + 'px';
}
window.addEventListener('resize', sync);
window.addEventListener('load', sync);
setTimeout(sync, 60);
setTimeout(sync, 500);
})();
let startPlayer = () => {};
(function player() {
const audio = $('audio');
const tracks = CFG.tracks || [];
let idx = 0, playing = false;
const EQ_BARS = 22;
const EQ_PALETTE = ['#ff3fae', '#c94dff', '#9b4dff', '#5e8bff', '#4dd4ff', '#4dffc9', '#ffd24d', '#ff7a4d'];
const eqLevels = new Array(EQ_BARS).fill(0);
let audioCtx = null, analyser = null, freqData = null;
let eqMode = (location.protocol === 'http:' || location.protocol === 'https:') ? 'real' : 'simulated';
function ensureAudioGraph() {
if (eqMode !== 'real' || audioCtx) return;
try {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const srcNode = audioCtx.createMediaElementSource(audio);
analyser = audioCtx.createAnalyser();
analyser.fftSize = 64;
analyser.smoothingTimeConstant = .75;
freqData = new Uint8Array(analyser.frequencyBinCount);
srcNode.connect(analyser);
analyser.connect(audioCtx.destination);
} catch (e) { eqMode = 'simulated'; }
}
function drawEqualizer(t) {
const canvas = $('equalizer');
if (canvas && canvas.width) {
const ctx = canvas.getContext('2d');
const w = canvas.width, h = canvas.height;
const gap = w / EQ_BARS;
const barW = Math.max(2, gap * .5);
ctx.clearRect(0, 0, w, h);
if (playing && eqMode === 'real' && analyser) {
analyser.getByteFrequencyData(freqData);
const step = Math.max(1, Math.floor(freqData.length / EQ_BARS));
for (let i = 0; i < EQ_BARS; i++) eqLevels[i] = Math.max(eqLevels[i] * .8, freqData[i * step] / 255);
} else if (playing) {
for (let i = 0; i < EQ_BARS; i++) {
const wobble = Math.sin(t / 260 + i * 1.7) * .5 + Math.sin(t / 130 + i * .6) * .3 + .5;
eqLevels[i] = Math.max(eqLevels[i] * .7, Math.max(.08, wobble));
}
} else {
for (let i = 0; i < EQ_BARS; i++) eqLevels[i] *= .88;
}
for (let i = 0; i < EQ_BARS; i++) {
const barH = Math.max(3, eqLevels[i] * h);
const x = i * gap + (gap - barW) / 2;
const y = h - barH;
const grad = ctx.createLinearGradient(0, h, 0, 0);
const color = EQ_PALETTE[i % EQ_PALETTE.length];
grad.addColorStop(0, 'rgba(255,255,255,.10)');
grad.addColorStop(1, color);
ctx.fillStyle = grad;
const r = Math.min(barW / 2, 3);
ctx.beginPath();
ctx.moveTo(x, h);
ctx.lineTo(x, y + r);
ctx.arcTo(x, y, x + r, y, r);
ctx.lineTo(x + barW - r, y);
ctx.arcTo(x + barW, y, x + barW, y + r, r);
ctx.lineTo(x + barW, h);
ctx.closePath();
ctx.fill();
}
}
requestAnimationFrame(drawEqualizer);
}
function sizeEqualizer() {
const canvas = $('equalizer');
const wrap = canvas.parentElement;
canvas.width = wrap.clientWidth || 90;
canvas.height = wrap.clientHeight || 130;
}
window.addEventListener('resize', sizeEqualizer);
sizeEqualizer();
requestAnimationFrame(drawEqualizer);
function load(i, autoplay) {
idx = (i + tracks.length) % tracks.length;
const t = tracks[idx];
audio.src = t.src;
setText('trackTitle', t.title);
setText('trackArtist', t.artist);
setText('trackAlbum', t.album);
setSrc('trackCover', t.cover);
setText('tapeLabel', 'SIDE ' + (idx % 2 === 0 ? 'A' : 'B') + ' · PISTA ' + (idx + 1));
if (autoplay) play();
}
function play() {
ensureAudioGraph();
if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
audio.play().then(() => {
playing = true;
$('reelL').classList.add('spin');
$('reelR').classList.add('spin');
$('playLed').classList.add('active');
$('playPause').textContent = '⏸';
}).catch(() => {});
}
function pause() {
audio.pause();
playing = false;
$('reelL').classList.remove('spin');
$('reelR').classList.remove('spin');
$('playLed').classList.remove('active');
$('playPause').textContent = '▶';
}
function fmt(s) {
if (!isFinite(s)) return '0:00';
const m = Math.floor(s / 60), r = Math.floor(s % 60);
return m + ':' + String(r).padStart(2, '0');
}
audio.addEventListener('timeupdate', () => {
$('seek').value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
setText('curTime', fmt(audio.currentTime));
setText('durTime', fmt(audio.duration));
});
audio.addEventListener('ended', () => load(idx + 1, true));
$('seek').addEventListener('input', e => {
if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
});
$('volume').addEventListener('input', e => { audio.volume = e.target.value; });
$('playPause').addEventListener('click', () => (playing ? pause() : play()));
$('prevTrack').addEventListener('click', () => load(idx - 1, playing));
$('nextTrack').addEventListener('click', () => load(idx + 1, playing));
audio.volume = CFG.initialVolume ?? .6;
$('volume').value = audio.volume;
load(0, false);
startPlayer = (auto) => { if (auto && CFG.autoplayOnEnter) load(idx, true); };
pausePlayer = () => pause();
})();
(function messages() {
const el = $('messageText');
const list = CFG.messages || [];
let i = 0;
if (!list.length) return;
el.textContent = list[0];
setInterval(() => {
el.classList.add('fade');
setTimeout(() => {
i = (i + 1) % list.length;
el.textContent = list[i];
el.classList.remove('fade');
}, 500);
}, CFG.messageIntervalMs || 7000);
})();
(function counter() {
const SESSION_KEY = 'xat_last_' + CFG.counterKey;
const LOCAL_KEY = 'xat_localcount_' + CFG.counterKey;
const now = Date.now();
const windowMs = (CFG.counterSessionMinutes || 30) * 60000;
let last = 0;
try { last = parseInt(localStorage.getItem(SESSION_KEY) || '0', 10); } catch (e) {}
const shouldCount = !last || (now - last) > windowMs;
const base = `${CFG.counterBaseUrl}/${CFG.counterNamespace}/${CFG.counterKey}`;
const url = shouldCount ? `${base}/up` : base;
function markSession() {
if (shouldCount) { try { localStorage.setItem(SESSION_KEY, String(now)); } catch (e) {} }
}
function localFallback() {
let n = 0;
try { n = parseInt(localStorage.getItem(LOCAL_KEY) || '0', 10); } catch (e) {}
if (shouldCount) n += 1;
if (!n) n = 1;
try { localStorage.setItem(LOCAL_KEY, String(n)); } catch (e) {}
setText('counterValue', n);
markSession();
}
fetch(url).then(r => {
if (!r.ok) throw new Error('status ' + r.status);
return r.json();
}).then(data => {
const count = data.count ?? data.value ?? (data.data && (data.data.up_count ?? data.data.value));
if (count == null) throw new Error('sin campo de conteo');
setText('counterValue', count);
markSession();
}).catch(localFallback);
})();
(function about() {
const modal = $('aboutModal');
const list = $('catList');
const stage = $('catStage');
const bar = $('catProgress').firstElementChild;
const cats = CFG.aboutCategories || [];
let idx = 0, auto = null, tickMs = CFG.aboutAutoMs || 6500, elapsed = 0;
cats.forEach((c, i) => {
const li = document.createElement('li');
const b = document.createElement('button');
b.textContent = c.icon ? `${c.icon} ${c.short}` : c.short;
if (i === 0) b.classList.add('active');
b.addEventListener('click', () => go(i));
li.appendChild(b);
list.appendChild(li);
const pane = document.createElement('div');
pane.className = 'cat-pane' + (i === 0 ? ' active' : '');
let html = `<h3>${c.title}</h3>`;
if (c.text) html += `<p>${c.text}</p>`;
if (c.list) html += `<ul>${c.list.map(x => `<li>${x}</li>`).join('')}</ul>`;
pane.innerHTML = html;
stage.appendChild(pane);
});
function go(i) {
const panes = [...stage.children];
const prev = panes[idx];
idx = (i + cats.length) % cats.length;
panes.forEach((p, n) => {
p.classList.toggle('active', n === idx);
p.classList.remove('leaving');
});
if (prev && prev !== panes[idx]) prev.classList.add('leaving');
[...list.querySelectorAll('button')].forEach((b, n) => b.classList.toggle('active', n === idx));
elapsed = 0;
}
function tick() {
elapsed += 60;
bar.style.width = Math.min(100, (elapsed / tickMs) * 100) + '%';
if (elapsed >= tickMs) go(idx + 1);
}
function startAuto() { clearInterval(auto); elapsed = 0; auto = setInterval(tick, 60); }
function stopAuto() { clearInterval(auto); }
$('catPrev').addEventListener('click', () => { go(idx - 1); startAuto(); });
$('catNext').addEventListener('click', () => { go(idx + 1); startAuto(); });
$('aboutBtn').addEventListener('click', () => { modal.hidden = false; go(0); startAuto(); });
$('closeAbout').addEventListener('click', () => { modal.hidden = true; stopAuto(); });
modal.querySelector('.modal-backdrop').addEventListener('click', () => { modal.hidden = true; stopAuto(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) { modal.hidden = true; stopAuto(); } });
})();</script>
